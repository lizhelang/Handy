[package]
name = "inputia-release"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17.14"
time = { version = "0.3", features = ["parsing"] }
regex = "1"
toml = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
