[package]
name = "inputia-updater"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
inputia-settings = { path = "../inputia-settings" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
