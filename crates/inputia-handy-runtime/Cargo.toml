[package]
name = "inputia-handy-runtime"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "inputia_handy_runtime"
path = "src/lib.rs"

[dependencies]
inputia-core = { path = "../inputia-core", features = ["sqlite-memory"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
