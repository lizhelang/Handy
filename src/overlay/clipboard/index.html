<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Clipboard Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.getElementById("root").textContent = "clipboard overlay loading";
      window.addEventListener("error", (event) => {
        document.body.style.background = "#fff";
        document.getElementById("root").textContent =
          event.message || "clipboard overlay script error";
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.body.style.background = "#fff";
        document.getElementById("root").textContent =
          event.reason?.message || String(event.reason);
      });
    </script>
    <script type="module" src="/src/overlay/clipboard/main.tsx"></script>
  </body>
</html>
