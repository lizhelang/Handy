schema:
  schema_id: static_pinyin
  name: 合成全拼验证
  version: "1.0"
switches:
  - name: ascii_mode
    reset: 0
ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
engine:
  processors: [ascii_composer, speller, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [lua_filter@static_probe_filter]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: static_probe
  prism: static_pinyin
  enable_user_dict: true
